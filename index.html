<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exec Copilot AI</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#0b0b10;
  color:#fff;
}

.container {
  padding:20px;
}

h1 {
  font-size:20px;
}

textarea {
  width:100%;
  height:150px;
  border-radius:10px;
  border:none;
  padding:10px;
}

.buttons {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

button {
  padding:12px;
  border:none;
  border-radius:10px;
  background:#7b2cff;
  color:#fff;
  font-weight:bold;
}

.output {
  margin-top:20px;
  background:#1b1b2a;
  padding:15px;
  border-radius:10px;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="container">
  <h1>⚡ Exec Copilot AI</h1>

  <textarea id="inputText" placeholder="Cole aqui conversa, incidente, texto..."></textarea>

  <div class="buttons">
    <button onclick="runAI('resumo')">Resumo</button>
    <button onclick="runAI('resposta')">Resposta</button>
    <button onclick="runAI('executivo')">Executivo</button>
    <button onclick="runAI('tarefa')">Tarefa</button>
  </div>

  <div class="output" id="output">Resultado aparecerá aqui...</div>
</div>

<script>

const API_KEY = "COLE_SUA_API_KEY_AQUI";

async function runAI(tipo) {
  const text = document.getElementById("inputText").value;

  document.getElementById("output").innerText = "Processando...";

  let prompt = "";

  if (tipo === "resumo") {
    prompt = `Resuma o texto abaixo de forma clara, objetiva e natural, como um gestor experiente explicaria:

${text}`;
  }

  if (tipo === "resposta") {
    prompt = `Gere uma resposta de WhatsApp, humana, direta e profissional, baseada no texto:

${text}`;
  }

  if (tipo === "executivo") {
    prompt = `Crie um resumo executivo curto, com:
- contexto
- status
- impacto
- próximos passos

Baseado no texto:

${text}`;
  }

  if (tipo === "tarefa") {
    prompt = `Transforme o texto abaixo em uma tarefa clara contendo:
- título
- descrição
- prioridade
- próximo passo

Texto:

${text}`;
  }

  try {
    const response = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + API_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [
          {
            role: "system",
            content: "Você é um gestor experiente, direto, humano e objetivo. Evite linguagem robótica."
          },
          {
            role: "user",
            content: prompt
          }
        ],
        temperature: 0.7
      })
    });

    const data = await response.json();
    const result = data.choices[0].message.content;

    document.getElementById("output").innerText = result;

  } catch (error) {
    document.getElementById("output").innerText = "Erro ao chamar IA.";
  }
}

</script>

</body>
</html>
