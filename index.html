<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exec Copilot MVP</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#0b0b10;
  color:#fff;
}

.container {
  padding:20px;
}

h1 {
  font-size:20px;
  margin-bottom:10px;
}

textarea {
  width:100%;
  height:150px;
  border-radius:10px;
  border:none;
  padding:10px;
  font-size:14px;
}

.buttons {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

button {
  padding:12px;
  border:none;
  border-radius:10px;
  background:#7b2cff;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

button:hover {
  opacity:0.9;
}

.output {
  margin-top:20px;
  background:#1b1b2a;
  padding:15px;
  border-radius:10px;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="container">
  <h1>⚡ Exec Copilot</h1>

  <textarea id="inputText" placeholder="Cole aqui conversa do WhatsApp, incidente, texto..."></textarea>

  <div class="buttons">
    <button onclick="gerarResumo()">Resumo</button>
    <button onclick="gerarResposta()">Resposta</button>
    <button onclick="gerarExecutivo()">Executivo</button>
    <button onclick="gerarTarefa()">Tarefa</button>
  </div>

  <div class="output" id="output">Resultado aparecerá aqui...</div>
</div>

<script>

function getText() {
  return document.getElementById("inputText").value;
}

function setOutput(text) {
  document.getElementById("output").innerText = text;
}

// 🔹 RESUMO
function gerarResumo() {
  let text = getText();

  let resumo = `
📌 RESUMO:

• Contexto: ${text.substring(0, 80)}...
• Possível problema identificado
• Ações sendo discutidas
• Necessidade de acompanhamento

👉 Sugestão: validar responsáveis e prazos
  `;

  setOutput(resumo);
}

// 🔹 RESPOSTA WHATSAPP
function gerarResposta() {
  let resposta = `
Pessoal, fazendo um resumo rápido:

Identificamos o cenário e já estamos atuando.

Vou acompanhar de perto e qualquer atualização aviso aqui.

Se alguém tiver algo adicional, pode mandar 👍
  `;

  setOutput(resposta);
}

// 🔹 EXECUTIVO
function gerarExecutivo() {
  let text = getText();

  let executivo = `
📊 RELATÓRIO EXECUTIVO

• Contexto:
${text.substring(0, 100)}...

• Status atual:
Em análise / acompanhamento

• Impacto:
Potencial impacto operacional

• Próximos passos:
- Validar causa raiz
- Definir responsáveis
- Acompanhar evolução
  `;

  setOutput(executivo);
}

// 🔹 TAREFA
function gerarTarefa() {
  let tarefa = `
✅ TAREFA GERADA

• Título: Analisar situação reportada
• Responsável: A definir
• Prazo: Hoje

• Descrição:
Investigar cenário identificado, validar impacto e retornar com plano de ação.

• Prioridade: Alta
  `;

  setOutput(tarefa);
}

</script>

</body>
</html>
