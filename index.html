<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exec Copilot AI</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#0b0b10;
  color:#fff;
}

.container {
  padding:20px;
}

h1 {
  font-size:20px;
}

textarea {
  width:100%;
  height:150px;
  border-radius:10px;
  border:none;
  padding:10px;
  font-size:14px;
}

.buttons {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

button {
  padding:12px;
  border:none;
  border-radius:10px;
  background:#7b2cff;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

button:active {
  opacity:0.8;
}

.output {
  margin-top:20px;
  background:#1b1b2a;
  padding:15px;
  border-radius:10px;
  white-space:pre-wrap;
  min-height:120px;
}
</style>
</head>

<body>

<div class="container">
  <h1>⚡ Exec Copilot AI</h1>

  <textarea id="inputText" placeholder="Cole aqui conversa, incidente, texto..."></textarea>

  <div class="buttons">
    <button onclick="runAI('resumo')">Resumo</button>
    <button onclick="runAI('resposta')">Resposta</button>
    <button onclick="runAI('executivo')">Executivo</button>
    <button onclick="runAI('tarefa')">Tarefa</button>
  </div>

  <div class="output" id="output">Resultado aparecerá aqui...</div>
</div>

<script>

const API_KEY = "COLE_SUA_API_KEY_AQUI";

async function runAI(tipo) {
  const text = document.getElementById("inputText").value.trim();

  if (!text) {
    document.getElementById("output").innerText = "⚠️ Cole algum texto primeiro.";
    return;
  }

  document.getElementById("output").innerText = "⏳ Processando...";

  let prompt = "";

  if (tipo === "resumo") {
    prompt = `Resuma o texto abaixo de forma clara, objetiva e natural, como um gestor experiente:\n\n${text}`;
  }

  if (tipo === "resposta") {
    prompt = `Gere uma resposta de WhatsApp, humana, direta e profissional, baseada no texto:\n\n${text}`;
  }

  if (tipo === "executivo") {
    prompt = `Crie um resumo executivo curto com:
- Contexto
- Status
- Impacto
- Próximos passos

Texto:\n\n${text}`;
  }

  if (tipo === "tarefa") {
    prompt = `Transforme o texto abaixo em uma tarefa clara com:
- Título
- Descrição
- Prioridade
- Próximo passo

Texto:\n\n${text}`;
  }

  try {
    const response = await fetch("https://api.allorigins.win/raw?url=https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + API_KEY
      },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [
          {
            role: "system",
            content: "Você é um gestor experiente, direto, humano e objetivo. Evite linguagem robótica."
          },
          {
            role: "user",
            content: prompt
          }
        ],
        temperature: 0.7
      })
    });

    const data = await response.json();

    if (data.error) {
      document.getElementById("output").innerText =
        "❌ Erro da API: " + data.error.message;
      return;
    }

    const result = data.choices[0].message.content;

    document.getElementById("output").innerText = result;

  } catch (error) {
    document.getElementById("output").innerText =
      "❌ Erro de conexão. Pode ser bloqueio do navegador ou rede.";
  }
}

</script>

</body>
</html>
